replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/my-project/showcase/demo-app
  tag: ""          # set by CI to the git SHA; falls back to .Chart.AppVersion
  pullPolicy: IfNotPresent

serviceAccount:
  name: demo-app
  # Google service account bound via Workload Identity (terraform output app_service_account).
  gcpServiceAccount: ""

# Secret Manager secret read at startup, e.g. projects/my-project/secrets/demo-app-greeting
greetingSecret: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the app besides its own (e.g. ingress, monitoring).
  allowedNamespaces:
    - monitoring

monitoring:
  # Requires the Prometheus Operator CRDs (kube-prometheus-stack).
  serviceMonitor: true
  prometheusRule: true
  # Label your Prometheus instance selects on.
  releaseLabel: kube-prometheus-stack

terminationGracePeriodSeconds: 30
